 New&apos;, monospace" textLength="17" lengthAdjust="spacing"> }</text><text x="18" y="162.25" font-size="13" fill="#1f2933" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="109" lengthAdjust="spacing">sin lenguaje </text><text x="127" y="162.25" font-size="13" fill="#0f7b3c" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="59" lengthAdjust="spacing">&apos;texto&apos;</text></g>
