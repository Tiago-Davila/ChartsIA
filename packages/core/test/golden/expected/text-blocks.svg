<g data-id="notas" transform="translate(60 60)"><text x="8" y="34.25" font-size="24" fill="#1f2933" font-weight="bold" textLength="240.5" lengthAdjust="spacing">Notas &lt;de&gt; diseño</text><text x="8" y="68" font-size="14" fill="#1f2933" textLength="104" lengthAdjust="spacing">Un párrafo con</text><text x="116.5" y="68" font-size="14" fill="#1f2933" font-weight="bold" textLength="53" lengthAdjust="spacing">negrita</text><text x="169.5" y="68" font-size="14" fill="#1f2933" textLength="4" lengthAdjust="spacing">,</text><text x="178" y="68" font-size="14" fill="#1f2933" font-style="italic" textLength="50.5" lengthAdjust="spacing">cursiva</text><text x="233" y="68" font-size="14" fill="#1f2933" textLength="109" lengthAdjust="spacing">y un texto largo</text><text x="8" y="88" font-size="14" fill="#1f2933" textLength="344" lengthAdjust="spacing">que tiene que partirse en varias líneas para caber</text><text x="8" y="108" font-size="14" fill="#1f2933" textLength="222.5" lengthAdjust="spacing">en el ancho del bloque de texto.</text><text x="8" y="128" font-size="14" fill="#1f2933" textLength="233" lengthAdjust="spacing">Segunda línea del mismo párrafo.</text><text x="8" y="164.75" font-size="20" fill="#1f2933" font-weight="bold" textLength="64.5" lengthAdjust="spacing">Pasos</text><text x="8" y="197" font-size="14" fill="#1f2933" textLength="9.5" lengthAdjust="spacing">•</text><text x="26" y="197" font-size="14" fill="#1f2933" textLength="111" lengthAdjust="spacing">Crear el modelo</text><text x="8" y="217" font-size="14" fill="#1f2933" textLength="9.5" lengthAdjust="spacing">•</text><text x="26" y="217" font-size="14" fill="#1f2933" textLength="49.5" lengthAdjust="spacing">Validar</text><text x="80" y="217" font-size="14" fill="#1f2933" font-weight="bold" textLength="41.5" lengthAdjust="spacing">antes</text><text x="126" y="217" font-size="14" fill="#1f2933" textLength="80.5" lengthAdjust="spacing">de exportar</text><text x="8" y="250.75" font-size="17" fill="#1f2933" font-weight="bold" textLength="56" lengthAdjust="spacing">Orden</text><text x="8" y="282" font-size="14" fill="#1f2933" textLength="13.5" lengthAdjust="spacing">1.</text><text x="29.5" y="282" font-size="14" fill="#1f2933" textLength="55" lengthAdjust="spacing">Primero</text><text x="8" y="302" font-size="14" fill="#1f2933" textLength="13.5" lengthAdjust="spacing">2.</text><text x="29.5" y="302" font-size="14" fill="#1f2933" textLength="124" lengthAdjust="spacing">Segundo &amp; último</text></g>
