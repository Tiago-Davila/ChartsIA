ont-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="8.5" lengthAdjust="spacing"> </text><text x="77" y="116.25" font-size="13" fill="#7c3aed" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="67.5" lengthAdjust="spacing">function</text><text x="144.5" y="116.25" font-size="13" fill="#1f2933" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="277" lengthAdjust="spacing"> saluda(nombre: string): string {</text><text x="18" y="135.25" font-size="13" fill="#1f2933" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="17" lengthAdjust="spacing">  </text><text x="35" y="135.25" font-size="13" fill="#7c3aed" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="50.5" lengthAdjust="spacing">return</text><text x="85.5" y="135.25" font-size="13" fill="#1f2933" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="8.5" lengthAdjust="spacing"> </text><text x="94" y="135.25" font-size="13" fill="#0f7b3c" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="134.5" lengthAdjust="spacing">`Hola ${nombre}`</text><text x="228.5" y="135.25" font-size="13" fill="#1f2933" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="8.5" lengthAdjust="spacing">;</text><text x="18" y="154.25" font-size="13" fill="#1f2933" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="8.5" lengthAdjust="spacing">}</text></g>
<g data-id="python" transform="translate(520 360)"><rect x="8" y="24" width="222.5" height="96" rx="4" fill="#f5f7fa" stroke="#d5d9e0" stroke-width="1"/><text x="8" y="20" font-size="11" fill="#52606d" textLength="13.5" lengthAdjust="spacing">py</text><text x="18" y="48.25" font-size="13" fill="#7c3aed" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="42" lengthAdjust="spacing">class</text><text x="60" y="48.25" font-size="13" fill="#1f2933" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="67.5" lengthAdjust="spacing"> Pedido:</text><text x="18" y="67.25" font-size="13" fill="#1f2933" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="101" lengthAdjust="spacing">    total = </text><text x="119" y="67.25" font-size="13" fill="#b45309" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="25.5" lengthAdjust="spacing">3.5</text><text x="144.5" y="67.25" font-size="13" fill="#1f2933" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="17" lengthAdjust="spacing">  </text><text x="161.5" y="67.25" font-size="13" fill="#6b7280" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" font-style="italic" textLength="59" lengthAdjust="spacing"># monto</text><text x="18" y="86.25" font-size="13" fill="#1f2933" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="34" lengthAdjust="spacing">    </text><text x="52" y="86.25" font-size="13" fill="#7c3aed" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="25.5" lengthAdjust="spacing">def</text><text x="77.5" y="86.25" font-size="13" fill="#1f2933" font-family="&apos;JetBrains Mono&apos;, Consolas, &apos;Courier New&apos;, monospace" textLength="109" lengthAdjust="spacing">