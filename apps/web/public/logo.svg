<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA" />
      <stop offset="100%" stop-color="#71717A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#FAFAFA" flood-opacity="0.28" />
    </filter>
  </defs>
  <!-- Contenedor Base del Icono -->
  <rect width="512" height="512" rx="112" fill="#09090B" />
  <!-- Retícula Geométrica Sutil -->
  <g stroke="#FAFAFA" stroke-opacity="0.07" stroke-width="2">
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <circle cx="256" cy="256" r="180" fill="none" />
  </g>
  <!-- Objeto Geométrico Central -->
  <g filter="url(#softGlow)" transform="translate(256 256) scale(1.05) translate(-256 -256)">
                        <!-- Contorno Hexagonal Exterior -->
                        <polygon points="256,112 381,184 381,328 256,400 131,328 131,184" 
                                 fill="none" 
                                 stroke="url(#primaryGrad)" 
                                 stroke-width="20" 
                                 stroke-linejoin="round" />

                        <!-- Aristas Internas Isométricas -->
                        <path d="M 131 184 L 256 256 L 381 184 M 256 256 L 256 400" 
                              fill="none" 
                              stroke="url(#primaryGrad)" 
                              stroke-width="16" 
                              stroke-linecap="round" 
                              stroke-linejoin="round" />

                        <!-- Nodos de Vértices Clave -->
                        <circle cx="256" cy="112" r="23" fill="#71717A" />
                        <circle cx="381" cy="328" r="23" fill="#71717A" />
                        <circle cx="131" cy="328" r="23" fill="#71717A" />

                        <!-- Rombo Central de Confluencia -->
                        <polygon points="256,206 306,256 256,306 206,256" 
                                 fill="#09090B" 
                                 stroke="#71717A" 
                                 stroke-width="15" 
                                 stroke-linejoin="round" />
                        <circle cx="256" cy="256" r="12" fill="#71717A" />
                    
  </g>
</svg>